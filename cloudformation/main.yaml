AWSTemplateFormatVersion: '2010-09-09'
Description: 'Infraestructura Principal del Sistema de Asistencia (2 EC2s: Backend + Frontend)'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC en la que se desplegara la infraestructura (selecciona tu VPC default o personalizada)
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subred publica donde se crearan las instancias
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Par de llaves SSH existente en AWS EC2
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: AMI Ubuntu Server 24.04 LTS (x86_64) en la region elegida
  InstanceType:
    Type: String
    Default: 't3.micro'
    AllowedValues:
      - 't2.micro'
      - 't3.micro'
      - 't3.small'
    Description: Tipo de instancia EC2 (t3.micro / t2.micro entran en Free Tier)
  MiIp:
    Type: String
    Default: '0.0.0.0/0'
    Description: Tu direccion IP para restringir SSH en formato CIDR (ej. 190.10.20.30/32 o 0.0.0.0/0)
  Proyecto:
    Type: String
    Default: 'asistencia'
    Description: Prefijo para nombrar los recursos
  RepoUrl:
    Type: String
    Default: 'https://github.com/escobarnina/Mi-asistencia.git'
    Description: Repositorio Git del proyecto
  RepoRama:
    Type: String
    Default: 'main'
    Description: Rama a clonar
  DbPassword:
    Type: String
    NoEcho: true
    Default: 'AsistenciaSecretDb2026!'
    Description: Contrasena para la base de datos MySQL del backend
  JwtSecret:
    Type: String
    NoEcho: true
    Default: 'SuperSecretKeyForJWTAuthTokenAsistenciaApp2026!'
    Description: Secreto JWT para sesiones y autenticacion
  AdminEmail:
    Type: String
    Default: 'admin@asistencia.local'
    Description: Correo del administrador inicial
  AdminPassword:
    Type: String
    NoEcho: true
    Default: 'Admin1234*'
    Description: Contrasena del usuario administrador
  CargarSemilla:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Cargar datos de prueba de docentes, materias y estudiantes

Resources:
  # -------------------------------------------------------------
  # 1. Modulo de Seguridad y Firewalls
  # -------------------------------------------------------------
  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: './modules/security.yaml'
      Parameters:
        VpcId: !Ref VpcId
        MiIp: !Ref MiIp
        Proyecto: !Ref Proyecto

  # -------------------------------------------------------------
  # 2. Modulo de Backend (Node + MySQL)
  # -------------------------------------------------------------
  BackendStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: SecurityStack
    Properties:
      TemplateURL: './modules/backend.yaml'
      Parameters:
        SubnetId: !Ref SubnetId
        SecurityGroupId: !GetAtt SecurityStack.Outputs.BackendSecurityGroupId
        AmiId: !Ref AmiId
        KeyName: !Ref KeyName
        InstanceType: !Ref InstanceType
        Proyecto: !Ref Proyecto
        RepoUrl: !Ref RepoUrl
        RepoRama: !Ref RepoRama
        DbPassword: !Ref DbPassword
        JwtSecret: !Ref JwtSecret
        AdminEmail: !Ref AdminEmail
        AdminPassword: !Ref AdminPassword
        CargarSemilla: !Ref CargarSemilla

  # -------------------------------------------------------------
  # 3. Modulo de Frontend (React + Nginx)
  # -------------------------------------------------------------
  FrontendStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: BackendStack
    Properties:
      TemplateURL: './modules/frontend.yaml'
      Parameters:
        SubnetId: !Ref SubnetId
        SecurityGroupId: !GetAtt SecurityStack.Outputs.FrontendSecurityGroupId
        AmiId: !Ref AmiId
        KeyName: !Ref KeyName
        InstanceType: !Ref InstanceType
        Proyecto: !Ref Proyecto
        RepoUrl: !Ref RepoUrl
        RepoRama: !Ref RepoRama
        BackendPrivateIp: !GetAtt BackendStack.Outputs.BackendPrivateIp

Outputs:
  AppUrl:
    Description: URL publica para entrar al Frontend del Sistema de Asistencia
    Value: !GetAtt FrontendStack.Outputs.AppUrl

  BackendApiUrl:
    Description: Health check y API del Backend
    Value: !GetAtt BackendStack.Outputs.BackendApiUrl

  FrontendPublicIp:
    Description: Direccion IP publica de la VM Frontend
    Value: !GetAtt FrontendStack.Outputs.FrontendPublicIp

  BackendPublicIp:
    Description: Direccion IP publica de la VM Backend
    Value: !GetAtt BackendStack.Outputs.BackendPublicIp
