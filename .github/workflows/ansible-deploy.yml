name: CI/CD Pipeline - CloudFormation & Ansible Deploy

on:
  pull_request:
    branches: [ main, develop, feat/tvmslo ]
    paths:
      - 'tvms/**'
      - 'frontend/**'
      - 'backend/**'
  push:
    branches: [ main, develop, feat/tvmslo ]
    paths:
      - 'tvms/**'
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # FASE 1: CI (En cada PR) - Validación de sintaxis y calidad
  # -------------------------------------------------------------
  ci-validate:
    name: Lint & Sintaxis de Ansible y CloudFormation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Python y Ansible
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de validación
        run: |
          pip install ansible ansible-lint yamllint cfn-lint

      - name: Validar sintaxis de Playbooks de Ansible
        run: |
          cd tvms/ansible
          ansible-playbook --syntax-check ping.yml
          ansible-playbook --syntax-check playbooks/01-database.yml
          ansible-playbook --syntax-check playbooks/02-backend.yml
          ansible-playbook --syntax-check playbooks/03-frontend.yml
          ansible-playbook --syntax-check site.yml

      - name: Validar sintaxis de CloudFormation
        run: |
          cfn-lint -i W3002 -- tvms/cloudformation/main.yaml tvms/cloudformation/modules/*.yaml

  # -------------------------------------------------------------
  # FASE 2: CD (Al hacer MERGE a la rama objetivo)
  # Despliegue de CloudFormation y configuración con Ansible
  # -------------------------------------------------------------
  cd-deploy:
    name: Desplegar Infraestructura y Configurar con Ansible
    needs: ci-validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      frontend_ip: ${{ steps.get_ips.outputs.frontend_ip }}
      backend_ip: ${{ steps.get_ips.outputs.backend_ip }}
      database_ip: ${{ steps.get_ips.outputs.database_ip }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Instalar Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Inyectar o crear KeyPair en AWS y Llave SSH local
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/asistencia-devops-key.pem
          else
            # Si no hay secreto cargado, asegurar KeyPair en AWS y guardarlo
            aws ec2 delete-key-pair --key-name asistencia-devops-key --region "${{ secrets.AWS_REGION || 'us-east-1' }}" 2>/dev/null || true
            RAW_KEY=$(aws ec2 create-key-pair --key-name asistencia-devops-key --query "KeyMaterial" --output text --region "${{ secrets.AWS_REGION || 'us-east-1' }}")
            echo "$RAW_KEY" > ~/.ssh/asistencia-devops-key.pem
          fi
          chmod 600 ~/.ssh/asistencia-devops-key.pem

      - name: Asegurar Bucket S3 y Desplegar CloudFormation Stack
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          BUCKET="asistencia-cfn-plantillas-${ACCOUNT_ID}-${REGION}"
          
          # Crear bucket de plantillas si no existe
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || {
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" --create-bucket-configuration LocationConstraint="$REGION"
            fi
          }

          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=isDefault,Values=true" --query "Vpcs[0].VpcId" --output text)
          SUBNET_ID=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" "Name=default-for-az,Values=true" --query "Subnets[0].SubnetId" --output text)

          # Empaquetar módulos de CloudFormation hacia S3
          aws cloudformation package \
            --template-file tvms/cloudformation/main.yaml \
            --s3-bucket "$BUCKET" \
            --s3-prefix "cloudformation" \
            --output-template-file tvms/cloudformation/packaged.yaml

          # Desplegar stack con las 3 instancias EC2
          aws cloudformation deploy \
            --template-file tvms/cloudformation/packaged.yaml \
            --stack-name miasistencia-modular-stack \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
                VpcId=$VPC_ID \
                SubnetId=$SUBNET_ID \
                KeyName=asistencia-devops-key

      - name: Consultar Outputs de IPs en tiempo real
        id: get_ips
        run: |
          FRONTEND_IP=$(aws cloudformation describe-stacks --stack-name miasistencia-modular-stack --query "Stacks[0].Outputs[?OutputKey=='FrontendIP'].OutputValue" --output text)
          BACKEND_IP=$(aws cloudformation describe-stacks --stack-name miasistencia-modular-stack --query "Stacks[0].Outputs[?OutputKey=='BackendIP'].OutputValue" --output text)
          DATABASE_IP=$(aws cloudformation describe-stacks --stack-name miasistencia-modular-stack --query "Stacks[0].Outputs[?OutputKey=='DatabaseIP'].OutputValue" --output text)

          # Exportar como outputs del step y job en GitHub Actions
          echo "frontend_ip=$FRONTEND_IP" >> $GITHUB_OUTPUT
          echo "backend_ip=$BACKEND_IP" >> $GITHUB_OUTPUT
          echo "database_ip=$DATABASE_IP" >> $GITHUB_OUTPUT

          # Imprimir claramente en los logs de GitHub Actions
          echo "=========================================================="
          echo " IPs PÚBLICAS DESPLEGADAS EN AWS"
          echo "=========================================================="
          echo " Frontend IP : $FRONTEND_IP"
          echo " Backend IP  : $BACKEND_IP"
          echo " Database IP : $DATABASE_IP"
          echo "=========================================================="

          # Publicar resumen en GitHub Step Summary (UI de GitHub Actions)
          echo "### 🚀 Infraestructura Desplegada en AWS" >> $GITHUB_STEP_SUMMARY
          echo "| Recurso | IP Pública | URL de Acceso |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend** | \`$FRONTEND_IP\` | [http://$FRONTEND_IP](http://$FRONTEND_IP) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend API** | \`$BACKEND_IP\` | [http://$BACKEND_IP:8000](http://$BACKEND_IP:8000) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Database (MySQL)** | \`$DATABASE_IP\` | Puerto 3306 |" >> $GITHUB_STEP_SUMMARY

      - name: Generar Inventario Ansible con IPs obtenidas
        run: |
          cd tvms/ansible
          FRONTEND_IP="${{ steps.get_ips.outputs.frontend_ip }}"
          BACKEND_IP="${{ steps.get_ips.outputs.backend_ip }}"
          DATABASE_IP="${{ steps.get_ips.outputs.database_ip }}"

          cat <<EOF > inventario.ini
          [frontend]
          $FRONTEND_IP

          [backend]
          $BACKEND_IP

          [database]
          $DATABASE_IP

          [all:vars]
          ansible_user=ubuntu
          ansible_ssh_private_key_file=~/.ssh/asistencia-devops-key.pem
          ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF

          # Preparar group_vars desde plantilla
          if [ ! -f group_vars/all.yml ]; then
            cp group_vars/all.yml.example group_vars/all.yml
          fi

      - name: Pausa de estabilización SSH (20 segundos)
        run: sleep 20

      - name: Ejecutar Ansible Playbook (Aprovisionar Servidores)
        run: |
          cd tvms/ansible
          ANSIBLE_CONFIG=./ansible.cfg ansible-playbook site.yml
